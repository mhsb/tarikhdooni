name: به‌روزرسانی فهرست بسته‌ها
# هر وقت فایل بسته‌ای در packs اضافه، حذف یا ویرایش شد، packs/index.json خودکار ساخته و ثبت می‌شود.
on:
  push:
    paths:
      - 'packs/*.json'
      - '!packs/index.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-index.mjs
      - name: ثبت تغییر
        run: |
          if [ -n "$(git status --porcelain packs/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packs/index.json
            git commit -m "به‌روزرسانی خودکار فهرست بسته‌ها"
            git push
          fi
